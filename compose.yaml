services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncvs}
      POSTGRES_USER: ${POSTGRES_USER:-ncvs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncvs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ncvs}
      PGUSER: ${POSTGRES_USER:-ncvs}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ncvs}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
